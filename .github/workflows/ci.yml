name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip "setuptools>=77" wheel pytest
      - name: Install the package
        run: python -m pip install . && gaia --version
      - name: Test suite
        run: python -m pytest -q
      - name: Golden files
        run: python scripts/regen_golden.py --check
      - name: README examples
        run: python scripts/gen_readme_examples.py --check

  lint:
    name: ruff + mypy (target Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linters
        run: python -m pip install --upgrade pip "ruff==0.17.0" "mypy==1.20.2"
      - name: ruff
        run: ruff check gaia tests scripts --target-version py$(echo ${{ matrix.python-version }} | tr -d .)
      - name: mypy
        run: mypy --python-version ${{ matrix.python-version }}
