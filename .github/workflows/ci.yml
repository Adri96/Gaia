name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }}, ${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        engine: ["cython", "pure-python"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip "setuptools>=77" wheel pytest
      - name: Build the Cython extension
        if: matrix.engine == 'cython'
        run: |
          python -m pip install "Cython>=3.0"
          python setup.py build_ext --inplace
          python -c "import gaia.simulation as s; assert s._HAS_CYTHON, 'extension not loaded'"
      - name: Check the pure-Python engine is used
        if: matrix.engine == 'pure-python'
        run: python -c "import gaia.simulation as s; assert not s._HAS_CYTHON"
      - name: Install the package (no Cython in the build environment)
        if: matrix.engine == 'pure-python'
        run: python -m pip install . && gaia --version
      - name: Test suite
        run: python -m pytest -q
      - name: Test suite, pure-Python loop forced
        if: matrix.engine == 'cython'
        env:
          GAIA_FORCE_PYTHON: "1"
        run: python -m pytest -q
      - name: Golden files
        run: python scripts/regen_golden.py --check
      - name: README examples
        run: python scripts/gen_readme_examples.py --check

  lint:
    name: ruff + mypy (target Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linters
        run: python -m pip install --upgrade pip "ruff==0.17.0" "mypy==1.20.2"
      - name: ruff
        run: ruff check gaia tests scripts --target-version py$(echo ${{ matrix.python-version }} | tr -d .)
      - name: mypy
        run: mypy --python-version ${{ matrix.python-version }}
